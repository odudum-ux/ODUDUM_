<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vicente Dotes</title>
<meta name="description" content="Vicente Dotes (@odudum_) · Creador · Diseño Gráfico · Percussão">
<meta property="og:title" content="Vicente Dotes (@odudum_)">
<meta property="og:description" content="Creador · Diseño Gráfico · Percussão">
<meta property="og:image" content="92743.jpg">
<meta name="theme-color" content="#ececf1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --page: #ececf1;
    --card: #ffffff;
    --ink: #12151f;
    --blue: #3f74e0;
    --muted: #9a9aa5;
    --line: #ececf1;
    --pill: rgba(24, 28, 40, 0.55);
    --pad: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Poppins", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Tarjeta en formato 9:16, ocupa todo el alto de la pantalla sin scroll */
  .card {
    --h: calc(100dvh - 2 * var(--pad));
    height: var(--h);
    width: min(calc(100vw - 2 * var(--pad)), calc(var(--h) * 9 / 16));
    background: var(--card);
    border-radius: 30px;
    padding: 10px 10px 0;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 44px rgba(30, 36, 60, 0.08);
  }

  /* ---------- Carrusel ---------- */
  .carousel {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 22px;
    overflow: hidden;
    background: #c9d3ea;
    touch-action: pan-y;
    user-select: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .slide.active { opacity: 1; }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
  }
  /* Encuadre por foto (ajústalo si quieres recentrar) */
  .slide:nth-child(1) img { object-position: 50% 40%; }
  .slide:nth-child(2) img { object-position: 50% 50%; }
  .slide:nth-child(3) img { object-position: 45% 50%; }

  .counter {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 3;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--pill);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: var(--pill);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding-bottom: 2px;
    transition: background 0.2s ease;
  }
  .arrow:hover { background: rgba(24, 28, 40, 0.8); }
  .arrow.prev { left: 10px; }
  .arrow.next { right: 10px; }
  .arrow:focus-visible, .follow:focus-visible, .dot:focus-visible, .handle:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
  }

  .dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    z-index: 3;
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    transition: width 0.3s ease, background 0.3s ease;
  }
  .dot.active { width: 18px; background: #fff; }

  /* ---------- Info ---------- */
  .info {
    flex: 0 0 auto;
    padding: clamp(12px, 2.4dvh, 22px) 10px clamp(12px, 2.2dvh, 20px);
  }

  .name-row { display: flex; align-items: center; gap: 7px; }

  h1 {
    font-size: clamp(1.05rem, 2.9dvh, 1.45rem);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.015em;
  }

  .badge { width: 17px; height: 17px; flex: none; }

  .handle {
    display: inline-block;
    margin-top: 3px;
    font-size: clamp(0.78rem, 1.9dvh, 0.92rem);
    font-weight: 400;
    color: var(--blue);
    text-decoration: none;
  }

  .bio {
    margin-top: clamp(6px, 1.2dvh, 11px);
    font-size: clamp(0.6rem, 1.45dvh, 0.7rem);
    font-weight: 400;
    line-height: 1.7;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: clamp(10px, 1.9dvh, 18px);
    padding-top: clamp(10px, 1.9dvh, 18px);
    border-top: 1px solid var(--line);
  }
  .stat { text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat strong {
    display: block;
    font-size: clamp(0.95rem, 2.4dvh, 1.2rem);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .stat span {
    display: block;
    margin-top: 2px;
    font-size: clamp(0.58rem, 1.35dvh, 0.68rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .follow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: clamp(12px, 2.2dvh, 20px);
    padding: clamp(10px, 1.9dvh, 15px) 16px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: clamp(0.78rem, 1.8dvh, 0.9rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .follow:hover { background: #1f2433; }
  .follow:active { transform: scale(0.98); }
  .follow svg { width: 17px; height: 17px; }

  @media (prefers-reduced-motion: reduce) {
    .slide, .dot, .arrow, .follow { transition: none; }
  }
</style>
</head>

<body>
  <main class="card">

    <div class="carousel" id="carousel" aria-roledescription="carrusel" aria-label="Fotos de Vicente Dotes">
      <div class="slide active">
        <img src="92743.jpg" alt="Vicente con polerón negro al atardecer entre flores" decoding="async" fetchpriority="high">
      </div>
      <div class="slide">
        <img src="115661.jpg" alt="Vicente mirando hacia un lado junto a una ventana iluminada" decoding="async" loading="lazy">
      </div>
      <div class="slide">
        <img src="115667.jpg" alt="Vicente levantando un bombo de percusión" decoding="async" loading="lazy">
      </div>

      <div class="counter" id="counter" aria-live="polite">1/3</div>
      <button class="arrow prev" id="prev" aria-label="Foto anterior">&lsaquo;</button>
      <button class="arrow next" id="next" aria-label="Foto siguiente">&rsaquo;</button>
      <div class="dots" id="dots"></div>
    </div>

    <section class="info">
      <div class="name-row">
        <h1>Vicente Dotes</h1>
        <!-- Borra este <svg> si no quieres mostrar la insignia -->
        <svg class="badge" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#3f74e0" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3 1 3-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3-1-3 2.6-1.9 1-3 3.2.1z"/>
          <path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.3l3 3 5.4-6"/>
        </svg>
      </div>

      <a class="handle" href="https://www.instagram.com/odudum_" target="_blank" rel="noopener noreferrer">@odudum_</a>

      <p class="bio">Creador · Diseño Gráfico · Percussão</p>

      <div class="stats">
        <div class="stat"><strong>7</strong><span>Publicaciones</span></div>
        <div class="stat"><strong>1,750</strong><span>Seguidores</span></div>
        <div class="stat"><strong>2,344</strong><span>Seguidos</span></div>
      </div>

      <a class="follow" href="https://www.instagram.com/odudum_" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3.6"/>
          <path d="M2.5 20c.6-3.6 3.2-5.6 6.5-5.6s5.9 2 6.5 5.6"/>
          <path d="M19 8v6M16 11h6"/>
        </svg>
        Follow
      </a>
    </section>

  </main>

<script>
  (function () {
    var slides = document.querySelectorAll('.slide');
    var counter = document.getElementById('counter');
    var dotsBox = document.getElementById('dots');
    var carousel = document.getElementById('carousel');
    var total = slides.length;
    var current = 0;
    var dots = [];

    for (var i = 0; i < total; i++) {
      (function (n) {
        var d = document.createElement('button');
        d.className = 'dot' + (n === 0 ? ' active' : '');
        d.setAttribute('aria-label', 'Ir a la foto ' + (n + 1));
        d.addEventListener('click', function () { show(n); });
        dotsBox.appendChild(d);
        dots.push(d);
      })(i);
    }

    function show(n) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (n + total) % total;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
      counter.textContent = (current + 1) + '/' + total;

      var nextImg = slides[(current + 1) % total].querySelector('img');
      if (nextImg) nextImg.loading = 'eager';
    }

    document.getElementById('next').addEventListener('click', function () { show(current + 1); });
    document.getElementById('prev').addEventListener('click', function () { show(current - 1); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'ArrowLeft') show(current - 1);
    });

    var sx = 0, sy = 0;
    carousel.addEventListener('touchstart', function (e) {
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
    }, { passive: true });
    carousel.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - sx;
      var dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(dx < 0 ? current + 1 : current - 1);
    }, { passive: true });
  })();
</script>
</body>
</html>
